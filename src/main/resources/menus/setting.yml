id: "dbuyer:settings"
provider: "dbuyer:settings"
type: "CHEST"
size: 54
title: "<lang:dbuyer.categories.{current_category_id}.title> {current_page}/{max_page}"

slots: "10-16,19-25,28-34"

tick_update: 20

click_cooldown: 120

autobuy_line:
  if_selected: " <gradient:#ECD210:#ECD210>✔</gradient> <white><lang:dbuyer.autobuy.{id}.name>"
  else: " <gray><lang:dbuyer.autobuy.{id}.name>"

sorting_line:
  if_selected: " <gradient:#ECD210:#ECD210>✔</gradient> <white><lang:dbuyer.sorting.{id}.name>"
  else: " <gray><lang:dbuyer.sorting.{id}.name>"

buyer-item:
  lore:
    - "&f "
    - "&f <#C8C5C3>Стандартная цена:<#C8C5C3> <#EFCF13>{price}<#EFCF13>"
    - "&f <#C8C5C3>Текущая цена:<#C8C5C3> <#EFCF13>{total_price}<#EFCF13>"
    - "&f <#C8C5C3>Очки:<#C8C5C3> <#EFCF13>{points}<#EFCF13>"
    - "&f <#C8C5C3>Авто-скупщик:<#C8C5C3> {status}"
    - "&f "
  on_click:
    commands:
      - "[toggle_autobuy]"

items-defaults:
  page: &page
    oneOf:
      - material: '{MATERIAL}'
        name: '{NAME}'
        all_flags: true
        color: '{COLOR}'
        on_view: '{CHECK}'
        on_click:
          commands:
            - "{COMMAND}"
      - material: 'yellow_stained_glass_pane'
        name: '&f '

items:
  decorate:
    material: "yellow_stained_glass_pane"
    name: "&f "
    #lore: []
    slot: "1-8,17,26,35-44"

  back:
    material: "orange_dye"
    name: " <gradient:#E51B1B:#E74617>◀ Вернуться</gradient>"
    slot: "53"
    on_click:
      commands:
        - "[back_or_close]"

  prev_page:
    args:
      MATERIAL: 'tipped_arrow'
      NAME: '&f Предыдущая страница'
      COLOR: '#FFCC00'
      CHECK: '{current_page} != 1'
      COMMAND: '[previous_page]'
    <<+: *page
    slot: "45"

  next_page:
    args:
      MATERIAL: 'tipped_arrow'
      NAME: '&f Следующая страница'
      CHECK: '{current_page} != {max_page}'
      COLOR: '#FF9500'
      COMMAND: '[next_page]'
    <<+: *page
    slot: "52"

  toggle_autobuyer:
    material: "ochre_froglight"
    name: "&f Настройка авто-скупщика"
    lore:
      - "&f "
      - "{all_autobuy_modes}"
      - "&f "
    on_left_click:
      commands:
        - "[next_buyer_mode]"
    on_right_click:
      commands:
        - "[previous_buyer_mode]"
    slot: "0"

  sorting:
    material: "clock"
    name: "&f Сортировка"
    lore:
      - "&f "
      - "{all_sorting}"
      - "&f "
    on_click:
      commands:
        - "[next_sorting]"
    slot: "27"

  enable_all:
    material: "lime_candle"
    name: " <gradient:#3CFF00:#A9FF00>Включить</gradient> &fвсё в этой категории"
    slot: "9"
    on_click:
      commands:
        - "[enable_all]"

  disable_all:
    material: "red_candle"
    name: " <gradient:#FF2700:#FF3300>Выключить</gradient> &fвсё в этой категории"
    slot: "18"
    on_click:
      commands:
        - "[disable_all]"

  cat1:
    material: "rotten_flesh"
    name: "<lang:dbuyer.categories.mob-loots.name>"
    slot: "46"
    on_click:
      commands:
        - "[select_category] mob-loots"
  cat2:
    material: "glow_berries"
    name: "<lang:dbuyer.categories.ferm-loots.name>"
    slot: "47"
    on_click:
      commands:
        - "[select_category] ferm-loots"
  cat3:
    material: "lapis_lazuli"
    name: "<lang:dbuyer.categories.mine-loots.name>"
    slot: "48"
    on_click:
      commands:
        - "[select_category] mine-loots"
  cat4:
    material: "pale_oak_log"
    name: "<lang:dbuyer.categories.woods.name>"
    slot: "49"
    on_click:
      commands:
        - "[select_category] woods"
  cat5:
    material: "tropical_fish"
    name: "<lang:dbuyer.categories.fish-loots.name>"
    slot: "50"
    on_click:
      commands:
        - "[select_category] fish-loots"
  cat6:
    material: "piglin_head"
    name: "<lang:dbuyer.categories.other-loots.name>"
    slot: "51"
    on_click:
      commands:
        - "[select_category] other-loots"

